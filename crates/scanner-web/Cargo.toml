[package]
name = "scanner-web"
description = "Web front-end: HTTP API and browser UI for discovering scanners, scanning and downloading"
version.workspace = true
edition.workspace = true

[dependencies]
scanner-core.workspace = true
scanner-sane.workspace = true
scanner-destinations.workspace = true
anyhow.workspace = true
axum = "0.8"
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "macros", "signal"] }
